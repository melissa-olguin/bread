<!doctype html>  
	<html lang="en">  
        <head> 
        
            <meta charset="utf-8" /> 
            
            <title>About - Sample Form</title> 
            
        </head>  
        <body> 
        
            <h1>Join Our Newsletter</h1> 
            
            <form id="signup"> 
            
                <label>Name</label> 
                
                <input placeholder="Enter name"> 
                <br>
                <label>Email</label>
                <input type="text" placeholder="jane@example.com"> 
                <br>
                <label>Phone</label> 
                
                <input type="tel"> 
                <br>
                
                <label>Country</label> 
                
                <select> 
                
                <option value="">Select a country</option> 
                
                <option value="US">United States</option> 
                
                <option value="CA">Canada</option> 
                
                <option value="MX">Mexico</option> 
                
                </select> 
                <br>
                
                <div> 
                <input type="checkbox" id="promo" checked> 
                
                <label for="promo">Sign me up for promotional emails</label> 
                
                </div> 
                <br>
                
                <button type="submit">Submit</button> 
                
                <button type="reset">Reset</button> 
                
                
            
            </form> 
        
	</body> 
</html>
