        <!--contact form-->
       	<section>
			<form name="contact" netlify-honeypot="bot-field" method="POST" netlify>
                <h2>Contact Form</h2>
				<div class="fields">
					<div class="field">
						<label for="name">Name</label>
						<input type="text" name="name" id="name" />
					</div>
					<div class="field">
						<label for="email">Email</label>
						<input type="text" name="email" id="email" />
					</div>
					<div class="field">
						<label for="message">Message</label>
						<textarea name="message" id="message" placeholder="Enter your message" rows="3"></textarea>
					</div>
					<div class="field">
						<div data-netlify-recaptcha='true'></div>
					</div>
				</div>
				<ul class="actions">
					<li><input type="submit" value="Send Message" /></li>
					<li><input type="reset" value="Reset" /></li>
					<li><input type="checkbox" id="demo-human" name="demo-human" checked>

				</ul>
			</form>
		</section>
