        <!--contact form-->
       	<section>
			<form name="contact" netlify-honeypot="bot-field" method="POST" netlify>
                <h2>Contact Form</h2>
					<fieldset>
                        <legend>Your Information</legend>
						<label for="name">Full Name</label>
						<input type="text" name="name" id="name" required minlength="2" maxlength="100" placeholder="First Middlie Last Name"/>

						<label for="email">Email</label>
						<input type="email" name="email" id="email" required placeholder="youremail@gmail.com"/>
                    </fieldset>
					<fieldset>
                        <ledgend>Your Message</legend>
						<label for="message">Message</label>
						<textarea name="message" id="message" placeholder="How can we help you?" rows="3"  required minlength="10"></textarea>
                    </fieldset>

				</div>
				<ul class="actions">
					<li><input type="submit" value="Send Message" /></li>
					<li><input type="reset" value="Reset" /></li>

				</ul>
			</form>
		</section>
